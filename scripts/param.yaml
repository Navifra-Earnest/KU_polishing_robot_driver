# =============================================================================
#  param.yaml — 로봇 현장 보정값(오프셋) · 로봇에서 직접 편집하는 튜닝 파일
# =============================================================================
#  · 위치      : 로봇의  ~/navifra/param.yaml
#  · 적용시점  : 드라이버 런치(run_robot.sh / robot.launch) 시작 시 1회 로드되어,
#                각 노드의 기본 config(install/share/<pkg>/config/*.yaml) 값을 덮어씁니다(override).
#  · 편집      : nano ~/navifra/param.yaml  →  저장 후 드라이버 재시작(run_robot.sh)
#  · 배포(deploy) 동작:
#       - 이 파일이 없으면 템플릿에서 자동 생성됩니다.
#       - 이미 있으면 덮어쓰지 않고 보존합니다(현장 편집값 유지).
#       - 최신 템플릿은 항상 ~/navifra/param.default.yaml 로도 복사됩니다(새 항목 확인용).
#
#  ⚠️ 최상위 키는 노드 이름과 정확히 일치해야 적용됩니다:
#        base_controller / motor_driver_node / lift_driver
#     (여기 없는 키는 각 패키지 기본 config 값이 그대로 사용됩니다.)
# =============================================================================

# ── 구동 / 주행 보정 ──────────────────────────────────────────────────────
base_controller:
  wheel_radius: 0.0825       # [m] 바퀴 반경 (= 지름 0.165 / 2)
  wheel_separation: 0.65     # [m] 좌/우 바퀴 간격(윤거)
  gear_ratio: 9.0            # 모터축:바퀴 감속비 (9:1)
  swap_lr: false             # 좌/우 바퀴가 반대로 매핑되면 true

motor_driver_node:
  motor_directions: [-1, 1]  # 모터별 회전방향 부호(+1/-1). 거울상 장착 보정
                             # (⚠️ 2번 모터 수리 후 직진/제자리회전으로 최종 검증)

# ── 리프트 오프셋 ─────────────────────────────────────────────────────────
lift_driver:
  auto_home_on_start: false  # 런치 시 1회 자동 홈잉 여부. ⚠️true면 런치 즉시 리프트 자동 하강(하부 리미트).
  up_speed_rpm: 1000         # 상승 속도[rpm] (부호=상승 방향, 하강은 자동 -값)
  posi_ctrl_vel_rpm: 0       # 위치제어 최대속도[rpm] (0 = up_speed_rpm 사용)
  post_home_speed_scale: 2.0 # 홈잉 완료 후 수동 up/down·위치이동 속도 배율 (1.0=미적용)
  in_position_tol: 20        # |목표-현재| 이 값 이하면 위치이동 완료로 간주 [count]
  use_limit_switch_for_home: true # 홈잉 완료를 하부 리미트 신호(DI DIR 비트)로 판정. false=구 정지감지 추론
  auto_release_on_stop: true      # 리미트·구속으로 멈추면 속도 0 자동 전송(상부 CTRL_FAIL 예방)
  home_timeout_sec: 120.0    # 홈잉 제한시간[s]. 실측 전행정 하강 = 28.2s @2000rpm
  home_stall_counts: 5       # 이 카운트 이하로 위치변화 없으면 '정지'로 간주 → 하부 리미트 판정
  home_stall_sec: 1.5        # 위 정지가 이 시간 이상 지속되면 홈 도달로 판정
  auto_reset_on_alarm: true  # 리프트 알람 감지 시 자동 리셋(PID_ALARM_RESET) 시도. false=수동(/lift/reset)만
  alarm_reset_interval_sec: 2.0 # 자동 리셋 재시도 간격[s]
  alarm_reset_max_attempts: 5   # 연속 자동 시도 한계(0=무제한). 초과 시 포기 → /lift/reset 으로 재시도
  alarm_resume_max_cycles: 3    # 알람 해제 후 자동 재개(이동/홈잉) 반복 한계(0=무제한)
